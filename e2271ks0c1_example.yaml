# Example configuration for Pervasive Displays E2271KS0C1 2.7" e-paper display
# https://www.pervasivedisplays.com/product/2-71-e-ink-displays

esphome:
  name: epaper-demo
  friendly_name: E-Paper Demo

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

time:
  - platform: homeassistant
    id: current_time

spi:
  clk_pin: GPIO6
  mosi_pin: GPIO1

display:
  - platform: epaper_spi
    model: E2271KS0C1
    id: epd
    cs_pin: GPIO10
    dc_pin: GPIO7
    reset_pin: GPIO5
    busy_pin: GPIO4
    update_interval: 60s
    full_update_every: 10
    lambda: |-
      // Display: 264x176 pixels
      int w = it.get_width();
      int h = it.get_height();

      it.fill(COLOR_OFF);

      // Title
      it.printf(w / 2, 20, id(font_title), COLOR_ON, TextAlign::TOP_CENTER, "E2271KS0C1 Demo");

      // Current time
      auto time = id(current_time).now();
      if (time.is_valid()) {
        it.strftime(w / 2, h / 2, id(font_large), COLOR_ON, TextAlign::CENTER, "%H:%M", time);
        it.strftime(w / 2, h / 2 + 40, id(font_medium), COLOR_ON, TextAlign::CENTER, "%A, %B %d", time);
      } else {
        it.print(w / 2, h / 2, id(font_large), COLOR_ON, TextAlign::CENTER, "--:--");
      }

font:
  - file: "gfonts://Roboto@500"
    id: font_title
    size: 20

  - file: "gfonts://Roboto@500"
    id: font_large
    size: 48
    glyphs: "0123456789:-"

  - file: "gfonts://Roboto@500"
    id: font_medium
    size: 18
